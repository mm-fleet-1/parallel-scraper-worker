name: startup-canary
'on':
  workflow_dispatch: {}
jobs:
  canary:
    runs-on: ubuntu-22.04
    steps:
    - name: Startup marker
      run: echo "STARTUP t_job_start=$(date +%s)"
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Checkout marker
      run: echo "STARTUP t_checkout=$(date +%s)"
    - name: Pin VM self-signed cert if present
      run: "if [ -f \"$GITHUB_WORKSPACE/worker_ca.pem\" ]; then\n  echo \"WORKER_CA_BUNDLE=$GITHUB_WORKSPACE/worker_ca.pem\" >> \"$GITHUB_ENV\"\n  echo \"pinned VM cert -> WORKER_CA_BUNDLE\"\nfi\n"
    - uses: actions/setup-python@v5
      id: py
      with:
        python-version: '3.11'
    - name: Cache venv
      id: venv
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
    - name: Cache pip/uv downloads
      if: steps.venv.outputs.cache-hit != 'true'
      uses: actions/cache@v4
      with:
        path: '~/.cache/pip

          ~/.cache/uv

          '
        key: pydeps-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
    - name: Cache Playwright browsers
      id: pw
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
    - name: "Install deps (venv cache miss only; Playwright only \u2014 NO DB driver, NO Drive)"
      if: steps.venv.outputs.cache-hit != 'true'
      run: 'python -m venv .venv

        .venv/bin/python -m pip install --upgrade pip

        .venv/bin/pip install -e .

        '
    - name: Use venv
      run: 'echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

        echo "RUNNER_IMAGE=${ImageOS:-x}-${ImageVersion:-x}" >> "$GITHUB_ENV"   # for the .deb cache key

        echo "STARTUP t_deps=$(date +%s)"

        '
    - name: Install Playwright chromium (cache miss only)
      if: steps.pw.outputs.cache-hit != 'true'
      run: python -m playwright install --with-deps chromium
    - name: Cache Playwright system .debs
      if: steps.pw.outputs.cache-hit == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/pwdebs
        key: pwdebs-${{ env.RUNNER_IMAGE }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
    - name: Check Playwright chromium (cache hit)
      if: steps.pw.outputs.cache-hit == 'true'
      run: "# install, not skip: an unpinned playwright upgrade keeps the old browser cache key\n# (2026-10-16: 1.64 wanted chromium 1248, cache held an older build -> every worker failed setup).\n# A no-op\
        \ when the cached build already matches.\npython -m playwright install chromium\npkgs=$(python -m playwright install-deps --dry-run chromium 2>/dev/null \\\n       | sed -n 's/.*--no-install-recommends\
        \ \\([^\"]*\\).*/\\1/p' | head -1)\n# apt's own dry run, not dpkg-query: Playwright's list has a name dpkg does not know as\n# installed although apt resolves it (canary 1 Nov: the dpkg check never\
        \ passed).\nok() { [ -n \"$pkgs\" ] && apt-get -s --no-upgrade install --no-install-recommends $pkgs 2>/dev/null \\\n       | grep -q '^0 upgraded, 0 newly installed'; }\nD=\"$HOME/.cache/pwdebs\"\
        \nif ok; then\n  echo \"playwright system packages: all present, apt skipped\"\nelif ls \"$D\"/*.deb > /dev/null 2>&1 \\\n     && sudo apt-get install -y --no-install-recommends \"$D\"/*.deb > /tmp/pwdebs.log\
        \ 2>&1 && ok; then\n  echo \"playwright system packages: $(ls \"$D\"/*.deb | wc -l) cached .debs installed, no apt update\"\nelse\n  python -m playwright install-deps chromium\n  mkdir -p \"$D\"\
        \ && cp /var/cache/apt/archives/*.deb \"$D\"/ 2>/dev/null || true\n  echo \"playwright system packages: full install; kept $(ls \"$D\"/*.deb 2>/dev/null | wc -l) .debs for the next start\"\nfi\n"
    - name: Playwright marker
      run: echo "STARTUP t_playwright=$(date +%s)"
    - name: Debug check
      run: 'echo "--- dry-run raw:"; python -m playwright install-deps --dry-run chromium 2>&1 | cut -c1-600

        pkgs=$(python -m playwright install-deps --dry-run chromium 2>/dev/null | sed -n ''s/.*--no-install-recommends \([^"]*\).*/\1/p'' | head -1)

        echo "--- pkgs: [$pkgs]"

        echo "--- sim:"; apt-get -s --no-upgrade install --no-install-recommends $pkgs 2>&1 | tail -6

        '
