name: startup-canary
'on':
  workflow_dispatch: {}
jobs:
  canary:
    runs-on: ubuntu-22.04
    steps:
    - name: Startup marker
      run: echo "STARTUP t_job_start=$(date +%s)"
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Checkout marker
      run: echo "STARTUP t_checkout=$(date +%s)"
    - name: Pin VM self-signed cert if present
      run: "if [ -f \"$GITHUB_WORKSPACE/worker_ca.pem\" ]; then\n  echo \"WORKER_CA_BUNDLE=$GITHUB_WORKSPACE/worker_ca.pem\" >> \"$GITHUB_ENV\"\n  echo \"pinned VM cert -> WORKER_CA_BUNDLE\"\nfi\n"
    - uses: actions/setup-python@v5
      id: py
      with:
        python-version: '3.11'
    - name: Cache pip/uv downloads
      uses: actions/cache@v4
      with:
        path: '~/.cache/pip

          ~/.cache/uv

          '
        key: pydeps-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
    - name: Cache Playwright browsers
      id: pw
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
    - name: Cache venv
      id: venv
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
    - name: "Install deps (venv cache miss only; Playwright only \u2014 NO DB driver, NO Drive)"
      if: steps.venv.outputs.cache-hit != 'true'
      run: 'python -m venv .venv

        .venv/bin/python -m pip install --upgrade pip

        .venv/bin/pip install -e .

        '
    - name: Use venv
      run: 'echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

        echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"

        echo "STARTUP t_deps=$(date +%s)"

        '
    - name: Install Playwright chromium (cache miss only)
      if: steps.pw.outputs.cache-hit != 'true'
      run: python -m playwright install --with-deps chromium
    - name: Check Playwright chromium (cache hit)
      if: steps.pw.outputs.cache-hit == 'true'
      run: "# install, not skip: an unpinned playwright upgrade keeps the old browser cache key\n# (2026-10-16: 1.64 wanted chromium 1248, cache held an older build -> every worker failed setup).\n# A no-op\
        \ when the cached build already matches.\npython -m playwright install chromium\npkgs=$(python -m playwright install-deps --dry-run chromium 2>/dev/null \\\n       | sed -n 's/.*--no-install-recommends\
        \ \\([^\"]*\\).*/\\1/p' | head -1)\nif [ -n \"$pkgs\" ] && dpkg-query -W -f='${db:Status-Abbrev}\\n' $pkgs > /tmp/pwdeps 2>/dev/null \\\n   && ! grep -qv '^ii' /tmp/pwdeps; then\n  echo \"playwright\
        \ system packages: all $(wc -l < /tmp/pwdeps) present, apt skipped\"\nelse\n  python -m playwright install-deps chromium\nfi\n"
    - name: Playwright marker
      run: echo "STARTUP t_playwright=$(date +%s)"
    - name: Canary check
      run: 'python -c "import cloud.phase2_worker_api; from playwright.sync_api import sync_playwright as s; p=s().start(); b=p.chromium.launch(); pg=b.new_page(); pg.set_content(''<p>canary ok</p>'');
        print(pg.inner_text(''p'')); b.close(); p.stop()"

        grep -h STARTUP /dev/null || true'
