name: phase2-scrape
# Read by the sequencer (gh run list displayTitle): run id, lane and shards of each run,
# so ramp mode can count the shards a fleet really runs. Keep this format.
run-name: phase2 ${{ inputs.run_id || vars.ACTIVE_RUN_ID }} lane=${{ inputs.lane || '0' }} shards=${{ inputs.shards || vars.ACTIVE_SHARDS || '20' }}

# PUBLIC Phase 2 deep-scrape worker. Holds NO DB/Drive creds — only:
#   secret  WORKER_TOKEN     (bearer for the lease/submit API on the VM)
#   var     WORKER_API_BASE  (https URL of the API, e.g. the Cloudflare tunnel)
# The worker leases placeIds from / submits results to that API; it never
# touches Azure SQL or Google Drive.

on:
  workflow_dispatch:
    inputs:
      run_id:      { required: true,  type: string }
      shards:      { required: false, type: string, default: "12" }
      max_minutes: { required: false, type: string, default: "300" }
      concurrency: { required: false, type: string, default: "3" }   # placeIds scraped at once PER shard (1-5)
      horeca:      { required: false, type: string, default: "0" }   # 1 = gallery walk: menu cards + photo dates
      panel_extras: { required: false, type: string, default: "0" }  # 1 = Overview pass: price band, hours,
                                                                     #     popular times, links, share, menu tab
      menu_tab:    { required: false, type: string, default: "1" }   # 0 = skip the menu tab (the costliest part)
      screenshots: { required: false, type: string, default: "1" }   # 0 = no panel screenshots (backfill passes)
      photos:      { required: false, type: string, default: "1" }   # 0 = no CDN->blob photo mirroring
      batch:       { required: false, type: string, default: "20" }
      photo_dates_cap: { required: false, type: string, default: "" }  # legacy alias of walk_photo_cap
      flush_s:     { required: false, type: string, default: "20" }  # seconds between result/attribute POSTs
      # Walk limits (design §5). Empty = the code default; never a workflow default here.
      walk_photo_cap: { required: false, type: string, default: "" }  # PHASE2_WALK_PHOTO_CAP (0 = no photo cap)
      walk_max_items: { required: false, type: string, default: "" }  # PHASE2_WALK_MAX_ITEMS
      walk_max_s:     { required: false, type: string, default: "" }  # PHASE2_WALK_MAX_S
      shard_max_fail: { required: false, type: string, default: "" }  # PHASE2_SHARD_MAX_FAIL (fraction, code default 0.10)
      staging:     { required: false, type: string, default: "0" }   # PHASE2_STAGING 0|shadow|1 (design §13c)
      photo_dates_slim: { required: false, type: string, default: "0" }  # 1 = PHASE2_PHOTO_DATES_SLIM (drop photo_dates.items; owner go 11 Oct)
      lane:        { required: false, type: string, default: "0" }   # ramp mode: extra run of the same run_id
                                                                     #   on this fleet (own concurrency group)
  # MANUAL DISPATCH ONLY. The 30-minute self-drain cron was removed: with 21
  # fleet repos it meant every one of them picked up a run within half an hour of
  # ACTIVE_RUN_ID being set, which is far more concurrency than the lease API can
  # take (502s appear past ~120 concurrent clients). Re-dispatch deliberately, or
  # replace this with a scheduler that controls how many fleets join at once.

# Scheduled runs have no inputs -> fall back to repo variables.
concurrency:
  # lane: the sequencer's ramp mode runs several runs of one run_id on a fleet at once;
  # without it a second dispatch waits as 'pending' and a third replaces the second.
  group: phase2-${{ inputs.run_id || vars.ACTIVE_RUN_ID || 'none' }}-${{ inputs.lane || '0' }}
  cancel-in-progress: false

jobs:
  # Fail fast if a credential file or private-only module ever lands here.
  guard:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Secret / forbidden-path guard
        run: bash scripts/check_no_secrets.sh

  # DB-free planner: ask the API how many placeIds remain; build a shard matrix.
  plan:
    needs: guard
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      pending: ${{ steps.mk.outputs.pending }}
    steps:
      - uses: actions/checkout@v4   # for worker_ca.pem (pinned self-signed cert), if present
      - id: mk
        env:
          WORKER_API_BASE: ${{ vars.WORKER_API_BASE }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          RUN_ID: ${{ inputs.run_id || vars.ACTIVE_RUN_ID }}
          SHARDS: ${{ inputs.shards || vars.ACTIVE_SHARDS || '20' }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_ID:-}" ]; then
            # cron tick with no active run configured — exit free with no shards
            echo "no run_id (input or ACTIVE_RUN_ID var) — nothing to do"
            echo "pending=0" >> "$GITHUB_OUTPUT"
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${WORKER_API_BASE:-}" ] || [ -z "${WORKER_TOKEN:-}" ]; then
            echo "WORKER_API_BASE (var) and WORKER_TOKEN (secret) must be set on this repo." >&2
            exit 1
          fi
          base="${WORKER_API_BASE%/}"
          shards=$(( SHARDS < 1 ? 1 : (SHARDS > 20 ? 20 : SHARDS) ))
          # If the API uses a pinned self-signed cert (Azure static IP, no domain),
          # verify against it instead of the public CA set.
          cacert=""
          if [ -f "$GITHUB_WORKSPACE/worker_ca.pem" ]; then cacert="--cacert $GITHUB_WORKSPACE/worker_ca.pem"; fi
          prog=$(curl -fsS $cacert -H "Authorization: Bearer ${WORKER_TOKEN}" \
                   "${base}/phase2/progress?run_id=${RUN_ID}")
          echo "progress: ${prog}"
          # scraping counts: rows held in an API pod's lease buffer or by dead shards come
          # back via release/reclaim, and the shards wait for them (pending=true leases).
          pending=$(echo "$prog" | jq '((.queued // 0) + (.failed // 0) + (.scraping // 0))')
          if [ "$pending" -eq 0 ]; then
            matrix='[]'
          else
            matrix=$(jq -nc --argjson n "$shards" '[range(0;$n)]')
          fi
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix"   >> "$GITHUB_OUTPUT"
          echo "plan.phase2 run_id=${RUN_ID} pending=${pending} shards=${shards} matrix=${matrix}"

  scrape:
    needs: plan
    if: ${{ needs.plan.outputs.pending != '0' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      # STARTUP <name>=<epoch> lines are read by tools/startup_report.py (design §9.3).
      - name: Startup marker
        run: echo "STARTUP t_job_start=$(date +%s)"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Checkout marker
        run: echo "STARTUP t_checkout=$(date +%s)"
      - name: Pin VM self-signed cert if present
        run: |
          if [ -f "$GITHUB_WORKSPACE/worker_ca.pem" ]; then
            echo "WORKER_CA_BUNDLE=$GITHUB_WORKSPACE/worker_ca.pem" >> "$GITHUB_ENV"
            echo "pinned VM cert -> WORKER_CA_BUNDLE"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Keyed on uv.lock; the public worker repo may only carry pyproject.toml, so hash both.
      - name: Cache pip/uv downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: pydeps-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
      - name: Cache Playwright browsers
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
      - name: Install deps (Playwright only — NO DB driver, NO Drive)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          echo "STARTUP t_deps=$(date +%s)"
      - name: Install Playwright chromium (cache miss only)
        if: steps.pw.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium
      # The cache holds browser files only; a fresh runner still needs the system libs.
      - name: Install Playwright system deps (cache hit)
        if: steps.pw.outputs.cache-hit == 'true'
        # install, not install-deps: an unpinned playwright upgrade keeps the old browser cache key
        # (2026-10-16: 1.64 wanted chromium 1248, cache held an older build -> every worker failed setup).
        # A no-op when the cached build already matches.
        run: python -m playwright install --with-deps chromium
      - name: Playwright marker
        run: echo "STARTUP t_playwright=$(date +%s)"
      - name: Scrape (API mode)
        env:
          WORKER_API_BASE: ${{ vars.WORKER_API_BASE }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          # Signed-in Google session (Oct 2026: logged out = 10-photo "limited view").
          # Base64 storage_state, one line so it stays masked. Repo variable
          # GOOGLE_SESSION_OFF=1 runs logged out (kill switch). Unset secret = logged out.
          PHASE2_GOOGLE_STATE: ${{ vars.GOOGLE_SESSION_OFF != '1' && secrets.PHASE2_GOOGLE_STATE || '' }}
          PHASE2_CAPTURE_SCREENSHOTS: "${{ inputs.screenshots || '1' }}"
          # Worker INFO (TIMING, phase2.*) to stderr; without it the runner log had none (p10).
          PHASE2_LOG_LEVEL: INFO
          # ASYNC screenshots, preferred path: PUT each PNG straight to an Azure Blob
          # staging container (write-only container SAS — no account key, no read/list).
          # The private drainer (cloud/drain_screenshots_blob.py) empties it to Drive
          # CONTINUOUSLY, even while shards are still scraping. Unset → artifact fallback.
          PHASE2_SHOT_BLOB_SAS: ${{ secrets.PHASE2_SHOT_BLOB_SAS }}
          # Mirror each place's photos (Google CDN -> Blob) under <run_id>/<place_id>/.
          # Best-effort; "0" disables. Cap keeps per-place time bounded.
          PHASE2_PHOTOS_TO_BLOB: "${{ inputs.photos || '1' }}"
          # Walk limits (design §5): exported only when set, else the code default wins.
          # (The old workflow '30' / repo var ACTIVE_PHOTO_DATES_CAP fallback is gone.)
          IN_WALK_PHOTO_CAP: "${{ inputs.walk_photo_cap || inputs.photo_dates_cap }}"
          IN_WALK_MAX_ITEMS: "${{ inputs.walk_max_items }}"
          IN_WALK_MAX_S: "${{ inputs.walk_max_s }}"
          IN_SHARD_MAX_FAIL: "${{ inputs.shard_max_fail }}"
          # Fallback staging (also catches individual failed blob PUTs): save PNGs + a
          # manifest to this dir; the step below uploads it as a build artifact, drained
          # later by cloud/drain_screenshots.py. When every PUT lands in Blob the dir
          # stays empty and no artifact is produced (if-no-files-found: ignore).
          PHASE2_SHOT_DIR: ${{ github.workspace }}/_shots
          # placeIds scraped at once per shard (1 = sequential). Each adds a browser, so
          # it raises this runner's per-IP request rate — watch the failed/block rate.
          PHASE2_CONCURRENCY: "${{ inputs.concurrency || vars.ACTIVE_CONCURRENCY || '3' }}"
          # HoReCa capture: menu photos + posted dates + place-photo dates +
          # imagery class, embedded in the data JSON; menu cards -> Blob.
          PHASE2_HORECA: "${{ inputs.horeca || vars.ACTIVE_HORECA || '0' }}"
          PHASE2_PANEL_EXTRAS: "${{ inputs.panel_extras || vars.ACTIVE_PANEL_EXTRAS || '0' }}"
          PHASE2_MENU_TAB: "${{ inputs.menu_tab || vars.ACTIVE_MENU_TAB || '1' }}"
          PHASE2_FLUSH_INTERVAL_S: "${{ inputs.flush_s || '20' }}"
          # Durable result staging (design §13c): 0 = /results as today; shadow = also one Blob
          # object per outlet under p2shadow/; 1 = objects under p2results/ + /phase2/staged refs.
          # Objects use PHASE2_SHOT_BLOB_SAS (fallback MEDIA_BLOB_WRITE_SAS, not a fleet secret today).
          PHASE2_STAGING: "${{ inputs.staging || '0' }}"
          PHASE2_PHOTO_DATES_SLIM: "${{ inputs.photo_dates_slim || '0' }}"
          PHASE2_SPOOL_DIR: ${{ github.workspace }}/_p2spool
        # Exit 3 = this shard lost work (design §9 level 1); the run gate is in the sequencer.
        run: |
          [ -n "$IN_WALK_PHOTO_CAP" ] && export PHASE2_WALK_PHOTO_CAP="$IN_WALK_PHOTO_CAP"
          [ -n "$IN_WALK_MAX_ITEMS" ] && export PHASE2_WALK_MAX_ITEMS="$IN_WALK_MAX_ITEMS"
          [ -n "$IN_WALK_MAX_S" ] && export PHASE2_WALK_MAX_S="$IN_WALK_MAX_S"
          [ -n "$IN_SHARD_MAX_FAIL" ] && export PHASE2_SHARD_MAX_FAIL="$IN_SHARD_MAX_FAIL"
          echo "RESOURCES cores=$(nproc) mem_total_mb=$(free -m | awk '/Mem:/{print $2}')"
          ( while true; do echo "RESOURCES t=$(date +%s) mem_used_mb=$(free -m | awk '/Mem:/{print $3}') mem_avail_mb=$(free -m | awk '/Mem:/{print $7}') load1=$(cut -d' ' -f1 /proc/loadavg) chromium_rss_mb=$(ps -eo rss,comm | awk '/chrom/{s+=$1} END{printf "%d", s/1024}') chromium_procs=$(ps -eo comm | grep -c chrom)"; sleep 30; done ) & SAMPLER=$!
          python -m cloud.phase2_worker_api \
            --run-id "${{ inputs.run_id || vars.ACTIVE_RUN_ID }}" \
            --shard "${{ matrix.shard }}" \
            --max-minutes "${{ inputs.max_minutes || '300' }}" \
            --concurrency "${{ inputs.concurrency || vars.ACTIVE_CONCURRENCY || '3' }}" \
            --batch "${{ inputs.batch || '20' }}"
          RC=$?; kill $SAMPLER 2>/dev/null; exit $RC

      # Staging objects the shard could not upload before it ended (exit 3). Replay later with
      # python -m cloud.staging --replay-spool <dir> --run-id <run_id> (design §13c.3).
      - name: Upload result spool
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2spool-${{ inputs.run_id || vars.ACTIVE_RUN_ID }}-shard-${{ matrix.shard }}
          path: ${{ github.workspace }}/_p2spool
          if-no-files-found: ignore
          retention-days: 14

      # The durable screenshot queue: each shard's captured PNGs + manifest.jsonl, uploaded
      # off the ephemeral runner. Drained to Drive later by cloud/drain_screenshots.py.
      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ inputs.run_id || vars.ACTIVE_RUN_ID }}-shard-${{ matrix.shard }}
          path: ${{ github.workspace }}/_shots
          if-no-files-found: ignore
          retention-days: 7
