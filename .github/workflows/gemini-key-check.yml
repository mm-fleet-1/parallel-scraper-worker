name: gemini-key-check
# Is each Gemini key secret this repo can see present and active? Free GET calls only (models.list, batches.list):
# no generation, no spend. Logs slot, sha256[:8] fingerprint (spots one key mapped to many fleets), HTTP status and
# Google's error reason -- never the key or the error message (it can name the project).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "optional: model for ONE paid generate call (2-line haiku, <=60 tokens) on the first key; blank = free checks only"
        default: ""
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          MODEL: ${{ inputs.model }}
          LLM_BATCH_GEMINI_KEY: ${{ secrets.LLM_BATCH_GEMINI_KEY }}
          LLM_BATCH_GEMINI_KEY_1: ${{ secrets.LLM_BATCH_GEMINI_KEY_1 }}
          LLM_BATCH_GEMINI_KEY_2: ${{ secrets.LLM_BATCH_GEMINI_KEY_2 }}
          LLM_BATCH_GEMINI_KEY_3: ${{ secrets.LLM_BATCH_GEMINI_KEY_3 }}
          LLM_BATCH_GEMINI_KEY_4: ${{ secrets.LLM_BATCH_GEMINI_KEY_4 }}
          LLM_BATCH_GEMINI_KEY_5: ${{ secrets.LLM_BATCH_GEMINI_KEY_5 }}
          LLM_BATCH_GEMINI_KEY_6: ${{ secrets.LLM_BATCH_GEMINI_KEY_6 }}
          LLM_BATCH_GEMINI_KEY_7: ${{ secrets.LLM_BATCH_GEMINI_KEY_7 }}
          LLM_BATCH_GEMINI_KEY_8: ${{ secrets.LLM_BATCH_GEMINI_KEY_8 }}
          LLM_BATCH_GEMINI_KEY_9: ${{ secrets.LLM_BATCH_GEMINI_KEY_9 }}
          LLM_BATCH_GEMINI_KEY_10: ${{ secrets.LLM_BATCH_GEMINI_KEY_10 }}
          LLM_BATCH_GEMINI_KEY_11: ${{ secrets.LLM_BATCH_GEMINI_KEY_11 }}
          LLM_BATCH_GEMINI_KEY_12: ${{ secrets.LLM_BATCH_GEMINI_KEY_12 }}
          LLM_BATCH_GEMINI_KEY_13: ${{ secrets.LLM_BATCH_GEMINI_KEY_13 }}
          LLM_BATCH_GEMINI_KEY_14: ${{ secrets.LLM_BATCH_GEMINI_KEY_14 }}
          LLM_BATCH_GEMINI_KEY_15: ${{ secrets.LLM_BATCH_GEMINI_KEY_15 }}
          LLM_BATCH_GEMINI_KEY_16: ${{ secrets.LLM_BATCH_GEMINI_KEY_16 }}
          LLM_BATCH_GEMINI_KEY_17: ${{ secrets.LLM_BATCH_GEMINI_KEY_17 }}
          LLM_BATCH_GEMINI_KEY_18: ${{ secrets.LLM_BATCH_GEMINI_KEY_18 }}
          LLM_BATCH_GEMINI_KEY_19: ${{ secrets.LLM_BATCH_GEMINI_KEY_19 }}
          LLM_BATCH_GEMINI_KEY_20: ${{ secrets.LLM_BATCH_GEMINI_KEY_20 }}
          LLM_BATCH_GEMINI_KEY_21: ${{ secrets.LLM_BATCH_GEMINI_KEY_21 }}
        shell: python
        run: |
          import hashlib, json, os, urllib.error, urllib.request
          B = "https://generativelanguage.googleapis.com/v1beta/"
          def get(path, key):
              rq = urllib.request.Request(B + path, headers={"x-goog-api-key": key})
              try:
                  with urllib.request.urlopen(rq, timeout=20) as r: return r.status, ""
              except urllib.error.HTTPError as e:
                  try: err = json.load(e).get("error", {})
                  except Exception: err = {}
                  why = [d.get("reason") for d in err.get("details", []) if d.get("reason")]
                  return e.code, err.get("status", "") + ("/" + ",".join(why) if why else "")
              except Exception as e: return 0, type(e).__name__
          names = ["LLM_BATCH_GEMINI_KEY"] + [f"LLM_BATCH_GEMINI_KEY_{i}" for i in range(1, 22)]
          for n in names:
              k = os.environ.get(n, "").strip()
              if not k: continue
              m, mw = get("models?pageSize=1", k); b, bw = get("batches?pageSize=1", k)
              print(f"KEYCHECK {n} fp={hashlib.sha256(k.encode()).hexdigest()[:8]} models={m} {mw} batches={b} {bw}".rstrip())
          mdl = os.environ.get("MODEL", "").strip()
          k = next((os.environ[n].strip() for n in names if os.environ.get(n, "").strip()), "")
          if mdl and k:
              body = json.dumps({"contents": [{"parts": [{"text": "Write a 2-line haiku about a street-corner shop."}]}],
                                 "generationConfig": {"maxOutputTokens": 60}}).encode()
              rq = urllib.request.Request(B + f"models/{mdl}:generateContent", data=body,
                                          headers={"x-goog-api-key": k, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(rq, timeout=60) as r: o = json.load(r)
                  print("PAID " + json.dumps({"model": o.get("modelVersion"), "usage": o.get("usageMetadata")}))
                  print("PAID text: " + o["candidates"][0]["content"]["parts"][0]["text"].replace("
", " / "))
              except urllib.error.HTTPError as e:
                  print(f"PAID failed http={e.code} {json.load(e).get('error', {}).get('status', '')}")
          print("KEYCHECK slots_seen=" + str(sum(bool(os.environ.get(n, "").strip()) for n in names)))
