name: llm-batch-build
# 18 Oct 2026: run-name lets a driver find ITS run (gh run list --json displayTitle) instead of "latest".
run-name: ${{ inputs.dataset }} ${{ inputs.shards }}

# Generic: build Gemini Batch input chunks from client-written skeleton shards on blob,
# upload to the Files API and create the batch jobs. Manual dispatch only.
on:
  workflow_dispatch:
    inputs:
      client:        { required: true,  type: string, description: "client id, e.g. flora" }
      dataset:       { required: true,  type: string, description: "dataset id, e.g. riyadh" }
      shards:        { required: true,  type: string, description: "comma-separated shard names, e.g. shard_001,shard_002" }
      skeleton_base: { required: true,  type: string, description: "blob URL prefix holding <shard>.jsonl (no SAS)" }
      model:         { required: true,  type: string, default: "gemini-3.5-flash-lite" }
      key_index:     { required: false, type: string, default: "", description: "1..21 -> secret LLM_BATCH_GEMINI_KEY_<n>; blank = LLM_BATCH_GEMINI_KEY" }
      send_dim:      { required: false, type: string, default: "1536" }
      max_parallel:  { required: false, type: string, default: "13" }
      collect:       { required: false, type: boolean, default: true,  description: "chain a collect job that polls until every shard is collected to blob" }
      collect_wait_minutes: { required: false, type: string, default: "180", description: "give up polling after this long; uncollected jobs need a manual llm-batch-collect" }

# 18 Oct 2026: one group per RUN (was per dataset). The chained collect is now scoped to this run's own shards and never
# deletes the dataset cache, so runs of one dataset no longer need serializing -- and a per-dataset group let GitHub keep
# only ONE pending run, cancelling the older pending one (silently dropped shards when a driver dispatched several).
concurrency:
  group: llm-batch-run-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 -c 'import json,os,sys; m=list(dict.fromkeys(s.strip() for s in os.environ["SHARDS"].split(",") if s.strip())); sys.exit("more than 256 shards in one run") if len(m)>256 else print("matrix=" + json.dumps(m))' >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests pillow google-genai
      - name: Build + upload + create batch
        env:
          LLM_BATCH_GEMINI_KEY: ${{ secrets.LLM_BATCH_GEMINI_KEY }}
          LLM_BATCH_GEMINI_KEY_1: ${{ secrets.LLM_BATCH_GEMINI_KEY_1 }}
          LLM_BATCH_GEMINI_KEY_2: ${{ secrets.LLM_BATCH_GEMINI_KEY_2 }}
          LLM_BATCH_GEMINI_KEY_3: ${{ secrets.LLM_BATCH_GEMINI_KEY_3 }}
          LLM_BATCH_GEMINI_KEY_4: ${{ secrets.LLM_BATCH_GEMINI_KEY_4 }}
          LLM_BATCH_GEMINI_KEY_5: ${{ secrets.LLM_BATCH_GEMINI_KEY_5 }}
          LLM_BATCH_GEMINI_KEY_6: ${{ secrets.LLM_BATCH_GEMINI_KEY_6 }}
          LLM_BATCH_GEMINI_KEY_7: ${{ secrets.LLM_BATCH_GEMINI_KEY_7 }}
          LLM_BATCH_GEMINI_KEY_8: ${{ secrets.LLM_BATCH_GEMINI_KEY_8 }}
          LLM_BATCH_GEMINI_KEY_9: ${{ secrets.LLM_BATCH_GEMINI_KEY_9 }}
          LLM_BATCH_GEMINI_KEY_10: ${{ secrets.LLM_BATCH_GEMINI_KEY_10 }}
          LLM_BATCH_GEMINI_KEY_11: ${{ secrets.LLM_BATCH_GEMINI_KEY_11 }}
          LLM_BATCH_GEMINI_KEY_12: ${{ secrets.LLM_BATCH_GEMINI_KEY_12 }}
          LLM_BATCH_GEMINI_KEY_13: ${{ secrets.LLM_BATCH_GEMINI_KEY_13 }}
          LLM_BATCH_GEMINI_KEY_14: ${{ secrets.LLM_BATCH_GEMINI_KEY_14 }}
          LLM_BATCH_GEMINI_KEY_15: ${{ secrets.LLM_BATCH_GEMINI_KEY_15 }}
          LLM_BATCH_GEMINI_KEY_16: ${{ secrets.LLM_BATCH_GEMINI_KEY_16 }}
          LLM_BATCH_GEMINI_KEY_17: ${{ secrets.LLM_BATCH_GEMINI_KEY_17 }}
          LLM_BATCH_GEMINI_KEY_18: ${{ secrets.LLM_BATCH_GEMINI_KEY_18 }}
          LLM_BATCH_GEMINI_KEY_19: ${{ secrets.LLM_BATCH_GEMINI_KEY_19 }}
          LLM_BATCH_GEMINI_KEY_20: ${{ secrets.LLM_BATCH_GEMINI_KEY_20 }}
          LLM_BATCH_GEMINI_KEY_21: ${{ secrets.LLM_BATCH_GEMINI_KEY_21 }}
          MEDIA_BLOB_READ_SAS: ${{ secrets.MEDIA_BLOB_READ_SAS }}
          MEDIA_BLOB_WRITE_SAS: ${{ secrets.MEDIA_BLOB_WRITE_SAS }}   # submit markers (CONTRACT_SUBMIT.md)
          PHASE2_SHOT_BLOB_SAS: ${{ secrets.PHASE2_SHOT_BLOB_SAS }}
        run: |
          python tools/llm_batch_build.py \
            --skeleton-url "${{ inputs.skeleton_base }}/${{ matrix.shard }}.jsonl" \
            --client "${{ inputs.client }}" --dataset "${{ inputs.dataset }}" --shard "${{ matrix.shard }}" \
            --model "${{ inputs.model }}" --send-dim "${{ inputs.send_dim }}" \
            --key-index "${{ inputs.key_index }}" --max-minutes 105

  # 18 Oct 2026 (v2 round 2): scoped to THIS run's shard list (input), not to artifacts -- an artifact was written only
  # after batches.create returned, so a leg that died between create and the artifact left a real batch uncollected.
  # --chained: a shard is waited for while it has a batch, or an intent marker that is not a clean 404
  # (llm-batch/<client>/<dataset>/submit/<shard>.intent.json, written by the builder just before batches.create);
  # a leg that failed before submitting (QUOTA_TIMEOUT, SHARD_TOO_BIG, ...: prefail marker, no intent) is not waited for.
  # Other runs of the same dataset are untouched. No dataset clean-up here (batch jobs + prompt cache stay; the cache
  # expires after 48h). Anything still running at collect_wait_minutes stays uncollected: the driver dispatches
  # llm-batch-collect.yml with client + dataset and no shards at the end, which collects it and cleans up.
  # Collect exactly when a run is active. The llm-batch-collect cron was removed
  # 2026-08-21 (a cron records a run even when its `if` skips it, so a dormant collector
  # produced ~288 no-op runs/day). Chaining it here means nothing fires while idle, and a
  # finished build is never left with its results stranded in the Files API.
  # `needs: build` waits for the whole shard matrix; the batch jobs are still RUNNING at
  # that point, which is why this uses --wait-minutes rather than a single sweep.
  collect:
    needs: build
    if: ${{ always() && inputs.collect }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests google-genai
      - name: Poll + collect this run's shards -> blob
        env:
          LLM_BATCH_GEMINI_KEY: ${{ secrets.LLM_BATCH_GEMINI_KEY }}
          LLM_BATCH_GEMINI_KEY_1: ${{ secrets.LLM_BATCH_GEMINI_KEY_1 }}
          LLM_BATCH_GEMINI_KEY_2: ${{ secrets.LLM_BATCH_GEMINI_KEY_2 }}
          LLM_BATCH_GEMINI_KEY_3: ${{ secrets.LLM_BATCH_GEMINI_KEY_3 }}
          LLM_BATCH_GEMINI_KEY_4: ${{ secrets.LLM_BATCH_GEMINI_KEY_4 }}
          LLM_BATCH_GEMINI_KEY_5: ${{ secrets.LLM_BATCH_GEMINI_KEY_5 }}
          LLM_BATCH_GEMINI_KEY_6: ${{ secrets.LLM_BATCH_GEMINI_KEY_6 }}
          LLM_BATCH_GEMINI_KEY_7: ${{ secrets.LLM_BATCH_GEMINI_KEY_7 }}
          LLM_BATCH_GEMINI_KEY_8: ${{ secrets.LLM_BATCH_GEMINI_KEY_8 }}
          LLM_BATCH_GEMINI_KEY_9: ${{ secrets.LLM_BATCH_GEMINI_KEY_9 }}
          LLM_BATCH_GEMINI_KEY_10: ${{ secrets.LLM_BATCH_GEMINI_KEY_10 }}
          LLM_BATCH_GEMINI_KEY_11: ${{ secrets.LLM_BATCH_GEMINI_KEY_11 }}
          LLM_BATCH_GEMINI_KEY_12: ${{ secrets.LLM_BATCH_GEMINI_KEY_12 }}
          LLM_BATCH_GEMINI_KEY_13: ${{ secrets.LLM_BATCH_GEMINI_KEY_13 }}
          LLM_BATCH_GEMINI_KEY_14: ${{ secrets.LLM_BATCH_GEMINI_KEY_14 }}
          LLM_BATCH_GEMINI_KEY_15: ${{ secrets.LLM_BATCH_GEMINI_KEY_15 }}
          LLM_BATCH_GEMINI_KEY_16: ${{ secrets.LLM_BATCH_GEMINI_KEY_16 }}
          LLM_BATCH_GEMINI_KEY_17: ${{ secrets.LLM_BATCH_GEMINI_KEY_17 }}
          LLM_BATCH_GEMINI_KEY_18: ${{ secrets.LLM_BATCH_GEMINI_KEY_18 }}
          LLM_BATCH_GEMINI_KEY_19: ${{ secrets.LLM_BATCH_GEMINI_KEY_19 }}
          LLM_BATCH_GEMINI_KEY_20: ${{ secrets.LLM_BATCH_GEMINI_KEY_20 }}
          LLM_BATCH_GEMINI_KEY_21: ${{ secrets.LLM_BATCH_GEMINI_KEY_21 }}
          MEDIA_BLOB_READ_SAS: ${{ secrets.MEDIA_BLOB_READ_SAS }}
          MEDIA_BLOB_WRITE_SAS: ${{ secrets.MEDIA_BLOB_WRITE_SAS }}
          PHASE2_SHOT_BLOB_SAS: ${{ secrets.PHASE2_SHOT_BLOB_SAS }}
          CLIENT: ${{ inputs.client }}
          DATASET: ${{ inputs.dataset }}
          SHARDS: ${{ inputs.shards }}
          KEY_INDEX: ${{ inputs.key_index }}
          WAIT: ${{ inputs.collect_wait_minutes }}
        run: |
          python tools/llm_batch_collect.py --client "$CLIENT" --dataset "$DATASET" --shards "$SHARDS" --chained \
            --key-index "$KEY_INDEX" --wait-minutes "$WAIT"
